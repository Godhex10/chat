<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8" />
    <title>Register | Chatvia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive Bootstrap 5 Chat App" name="description" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">

    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

</head>

<body data-auth="guest">


    <div class="account-pages my-5 pt-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="auth-logo mb-5 d-block">
                            <img src="assets/images/logo-dark.png" alt="" height="30" class="logo logo-dark">
                            <img src="assets/images/logo-light.png" alt="" height="30" class="logo logo-light">
                        </a>

                        <h4>Sign up</h4>
                        <p class="text-muted mb-4">Get your Chatvia account now.</p>

                    </div>

                    <div class="card">
                        <div class="card-body p-4">
                            <div class="p-3">

                                <div id="auth-alert" class="alert d-none" role="alert"></div>

                                <form id="register-form" novalidate>

                                    <div class="mb-3">
                                        <label class="form-label" for="register-email">Email</label>
                                        <div class="input-group bg-light-subtle rounded-3 mb-3">
                                            <span class="input-group-text text-muted" id="basic-addon5">
                                                <i class="ri-mail-line"></i>
                                            </span>
                                            <input type="email" id="register-email" name="email" autocomplete="email"
                                                class="form-control form-control-lg bg-light-subtle border-light"
                                                placeholder="Enter Email" aria-label="Enter Email"
                                                aria-describedby="basic-addon5" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label" for="register-username">Username</label>
                                        <div class="input-group bg-light-subtle rounded-3">
                                            <span class="input-group-text border-light text-muted" id="basic-addon6">
                                                <i class="ri-user-2-line"></i>
                                            </span>
                                            <input type="text" id="register-username" name="username"
                                                autocomplete="username" maxlength="20"
                                                class="form-control form-control-lg bg-light-subtle border-light"
                                                placeholder="Enter Username" aria-label="Enter Username"
                                                aria-describedby="basic-addon6 username-hint" required>
                                        </div>
                                        <div id="username-hint" class="form-text"></div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label" for="register-password">Password</label>
                                        <div class="input-group bg-light-subtle rounded-3">
                                            <span class="input-group-text border-light text-muted" id="basic-addon7">
                                                <i class="ri-lock-2-line"></i>
                                            </span>
                                            <input type="password" id="register-password" name="password"
                                                autocomplete="new-password" minlength="6"
                                                class="form-control form-control-lg bg-light-subtle border-light"
                                                placeholder="Enter Password" aria-label="Enter Password"
                                                aria-describedby="basic-addon7 password-hint" required>
                                        </div>
                                        <div id="password-hint" class="form-text">At least 6 characters.</div>
                                    </div>


                                    <div class="d-grid">
                                        <button id="register-submit" class="btn btn-primary waves-effect waves-light"
                                            type="submit">Sign up</button>
                                    </div>

                                    <div class="mt-4 text-center">
                                        <p class="text-muted mb-0">By registering you agree to the Chatvia <a href="#"
                                                class="text-primary">Terms of Use</a></p>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 text-center">
                        <p>Already have an account ? <a href="login.html" class="fw-medium text-primary"> Signin </a>
                        </p>
                        <p>©
                            <script>document.write(new Date().getFullYear())</script> Chatvia.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end account-pages -->



    <!-- JAVASCRIPT -->
    <script src="assets/libs/jquery/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/simplebar/simplebar.min.js"></script>
    <script src="assets/libs/node-waves/waves.min.js"></script>

    <script src="assets/js/app.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>

</body>

</html>
